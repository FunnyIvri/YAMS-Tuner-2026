name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ipk:
    uses: ./.github/workflows/build-ipk.yml

  build:
    needs: ipk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          APP_VERSION: ${{ needs.ipk.outputs.version }}
          NEXT_PUBLIC_IPK_FILE: ${{ needs.ipk.outputs.file }}
          NEXT_PUBLIC_IPK_VERSION: ${{ needs.ipk.outputs.version }}
          NEXT_TELEMETRY_DISABLED: 1

      # Served beside the site, so the Download IPK button always gets the package built from this commit.
      - name: Add IPK to the site
        uses: actions/download-artifact@v4
        with:
          name: yams-tuner-ipk
          path: out

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
