name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pick package version
        id: version
        run: |
          # The same scheme as build-ipk.yml: a unique, ordered suffix on the package.json version
          version="$(node -p "require('./package.json').version")+${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=yams-tuner_${version}.ipk" >> "$GITHUB_OUTPUT"

      # Built first: it builds the site into out/ for SystemCore, which the hosted build below replaces.
      - name: Build IPK
        run: systemcore/build-ipk.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_IPK_FILE: ${{ steps.version.outputs.file }}
          NEXT_PUBLIC_IPK_VERSION: ${{ steps.version.outputs.version }}
          NEXT_TELEMETRY_DISABLED: 1

      # Served beside the site, so the Download IPK button always gets the package built from this commit.
      - name: Add IPK to the site
        run: cp "dist/${{ steps.version.outputs.file }}" out/

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
