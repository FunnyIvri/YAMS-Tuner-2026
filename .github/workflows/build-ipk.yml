name: Build SystemCore IPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pick package version
        id: version
        run: |
          # Development builds get a unique, ordered suffix; releases come from release.yml
          version="$(node -p "require('./package.json').version")+${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build IPK
        run: systemcore/build-ipk.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: yams-tuner-ipk
          path: dist/*.ipk
          if-no-files-found: error

